name: Test Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 0.4.5)'
        required: true
      step:
        description: 'Which step to test'
        required: true
        type: choice
        options:
          - index-only
          - push-and-index
          - debug-auth
          - check-token

permissions:
  contents: read
  packages: write

jobs:
  test-publish:
    name: Test Publish
    runs-on: ubuntu-latest
    steps:
      - name: Install scafctl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP_DIR="$(mktemp -d)"
          gh release download --repo oakwood-commons/scafctl \
            --pattern 'scafctl_*_Linux_x86_64.tar.gz' \
            --dir "${TMP_DIR}"
          tar xzf "${TMP_DIR}"/scafctl_*_Linux_x86_64.tar.gz -C "${TMP_DIR}"
          sudo mv "${TMP_DIR}/scafctl" /usr/local/bin/scafctl
          rm -rf "${TMP_DIR}"

      - name: Install crane
        uses: imjasonh/setup-crane@59c71e96a00b28651f10369ba3359a6d730740a0 # v0.6

      - name: Check CATALOG_PUSH_TOKEN validity
        if: inputs.step == 'check-token'
        env:
          TOKEN: ${{ secrets.CATALOG_PUSH_TOKEN }}
        run: |
          echo "=== Token introspection via GitHub API ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: token ${TOKEN}" https://api.github.com/user)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Token owner: $(echo "$BODY" | jq -r '.login')"
            echo "Token type: valid PAT"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "TOKEN IS INVALID OR EXPIRED"
            echo "$BODY" | jq -r '.message' 2>/dev/null || echo "$BODY"
          else
            echo "Unexpected status"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          fi

          echo ""
          echo "=== Token scopes ==="
          curl -s -I -H "Authorization: token ${TOKEN}" https://api.github.com/user 2>/dev/null | grep -i 'x-oauth-scopes'

          echo ""
          echo "=== Token expiry check ==="
          curl -s -I -H "Authorization: token ${TOKEN}" https://api.github.com/user 2>/dev/null | grep -i 'github-authentication-token-expiration'

          echo ""
          echo "=== GHCR token exchange test ==="
          GHCR_RESPONSE=$(curl -s -w "\n%{http_code}" -u "USERNAME:${TOKEN}" "https://ghcr.io/token?scope=repository:oakwood-commons/catalog-index:pull,push&service=ghcr.io")
          GHCR_CODE=$(echo "$GHCR_RESPONSE" | tail -1)
          echo "GHCR token exchange HTTP status: ${GHCR_CODE}"
          if [ "$GHCR_CODE" != "200" ]; then
            echo "GHCR exchange body:"
            echo "$GHCR_RESPONSE" | head -n -1 | jq . 2>/dev/null || echo "$GHCR_RESPONSE" | head -n -1
          else
            echo "GHCR token exchange: OK"
          fi

      - name: Debug auth
        if: inputs.step == 'debug-auth'
        run: |
          echo "=== GITHUB_TOKEN auth ==="
          mkdir -p ~/.docker
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "${AUTH}" > ~/.docker/config.json
          echo "Testing GITHUB_TOKEN against providers/github..."
          crane manifest ghcr.io/oakwood-commons/providers/github:${{ inputs.version }} > /dev/null 2>&1 && echo "  READ: OK" || echo "  READ: FAIL"
          echo "Testing GITHUB_TOKEN push (dry-run tag)..."
          crane tag ghcr.io/oakwood-commons/providers/github:${{ inputs.version }} test-push-check 2>&1 && echo "  WRITE: OK" || echo "  WRITE: FAIL"
          crane delete ghcr.io/oakwood-commons/providers/github:test-push-check 2>/dev/null || true

          echo ""
          echo "=== CATALOG_PUSH_TOKEN auth ==="
          AUTH2=$(printf '%s' "${{ github.actor }}:${{ secrets.CATALOG_PUSH_TOKEN }}" | base64 -w 0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "${AUTH2}" > ~/.docker/config.json
          echo "Testing CATALOG_PUSH_TOKEN against catalog-index..."
          crane manifest ghcr.io/oakwood-commons/catalog-index:latest > /dev/null 2>&1 && echo "  READ: OK" || echo "  READ: FAIL"
          echo "Testing CATALOG_PUSH_TOKEN against providers/github..."
          crane manifest ghcr.io/oakwood-commons/providers/github:${{ inputs.version }} > /dev/null 2>&1 && echo "  READ: OK" || echo "  READ: FAIL"

      - name: Login with GITHUB_TOKEN
        if: inputs.step == 'push-and-index'
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "${AUTH}" > ~/.docker/config.json

      - name: Refresh catalog index (CATALOG_PUSH_TOKEN)
        if: inputs.step == 'index-only' || inputs.step == 'push-and-index'
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.CATALOG_PUSH_TOKEN }}" | base64 -w 0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "${AUTH}" > ~/.docker/config.json
          scafctl catalog index push \
            --catalog "oci://ghcr.io/${{ github.repository_owner }}" \
            --debug
